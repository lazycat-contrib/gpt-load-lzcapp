name: GPT Load
package: lazycat.community.app.gpt-load
version: 1.0.19
min_os_version: 1.3.8
description: "智能密钥轮询的多渠道 AI 代理。"
homepage: https://github.com/tbphp/gpt-load
author: tbphp
application:
    subdomain: gpt-load
    background_task: true
    public_path:
        - /
    routes:
        - /=http://gpt-load:3001/
services:
    gpt-load:
        # ghcr.io/tbphp/gpt-load:v1.0.19
        image: registry.lazycat.cloud/czyt/tbphp/gpt-load:9cd7e32c8365fd88
        ontainer_name: gpt-load
        environment:
            - SERVER_READ_TIMEOUT=60
            - SERVER_WRITE_TIMEOUT=600
            - SERVER_IDLE_TIMEOUT=120
            - SERVER_GRACEFUL_SHUTDOWN_TIMEOUT=10
            # 从节点标识
            - IS_SLAVE=false
            # 时区
            - TZ=Asia/Shanghai
            # 认证配置 是必需的，用于保护管理 API 和 UI 界面
            - AUTH_KEY={{.U.auth_key}}

            - REDIS_DSN=redis://redis:6379/0

            # 并发数量
            - MAX_CONCURRENT_REQUESTS=100

            # CORS配置
            - ENABLE_CORS=true
            - ALLOWED_ORIGINS=*
            - ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS
            - ALLOWED_HEADERS=*
            - ALLOW_CREDENTIALS=false

            # 日志配置
            - LOG_LEVEL=info
            - LOG_FORMAT=text
            - LOG_ENABLE_FILE=true
            - LOG_FILE_PATH=./data/logs/app.log
        binds:
            - /lzcapp/var/data:/app/data
        health_check:
            test:
                - CMD-SHELL
                - wget -q --spider -T 10 -O /dev/null http://localhost:${PORT:-3001}/health
            start_period: 30s

        depends_on:
            - redis

    redis:
        image: registry.lazycat.cloud/czyt/library/redis:6108db5ea790851d
        container_name: redis
        health_check:
            test:
                - CMD-SHELL
                - redis-cli ping
            start_period: 90s
