version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: output/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: gpt-load

build:
  run_buildscript: false

images:
  - id: gpt-load
    target: service
    service: gpt-load
    source: ghcr.io/tbphp/gpt-load
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      image_template: ghcr.1ms.run/tbphp/gpt-load:{tag}
      require_digest_match: true
  - id: redis
    target: service
    service: redis
    source: docker.io/library/redis
    channel: stable
    sort: semver
    tag_regex: '^7\.\d+\.\d+$'
    delivery:
      mode: mirror
      image_template: docker.1ms.run/library/redis:{tag}
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: GPT Load
    summary: 由 GitHub Actions 自动发布
